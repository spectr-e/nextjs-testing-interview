<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      const userPic = "https://supersimple.dev/projects/chatbot/user.png";
      const robotPic = "https://supersimple.dev/projects/chatbot/robot.png";
      const messagesList = [
        {
          message: "hello chatbot",
          sender: "user",
          id: 101,
        },
        {
          message: "Hello! How can I help you?",
          sender: "robot",
          id: 102,
        },
        {
          message: "can you get me todays date",
          sender: "user",
          id: 103,
        },
        {
          message: "Today is April 3",
          sender: "robot",
          id: 104,
        },
      ];

      function ChatInput() {
        return (
          <form action="submit">
            <input placeholder="Send message to chatbot" size="30" />
            <button type="submit" onClick={HandleSendMessage}>
              Send Message
            </button>
          </form>
        );
      }

      function DisplayMessage({ message, sender }) {
        return (
          <div>
            <img
              src={sender === "user" ? userPic : robotPic}
              alt="profile picture"
              width="50"
            />
            <p>{message}</p>
          </div>
        );
      }

      function HandleSendMessage(e) {
        e.preventDefault();

        const userMessage = {
          message: e.target.value,
          sender: "user",
          id: Math.floor(Math.random() * 900) + 100,
        };
        // messagesList.push(userMessage);
        console.log(e.target.value);
      }

      function ChatMessages() {
        return (
          <>
            {messagesList.map((instance) => (
              <DisplayMessage
                key={instance.id}
                message={instance.message}
                sender={instance.sender}
              />
            ))}
          </>
        );
      }

      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessages />
          </>
        );
      }

      root.render(<App />);
    </script>
  </body>
</html>
