<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      const userPic = "https://supersimple.dev/projects/chatbot/user.png";
      const robotPic = "https://supersimple.dev/projects/chatbot/robot.png";

      function ChatInput({ messages, setMessage }) {
        const [inputText, setInputText] = React.useState("");

        function HandleInputChange(e) {
          setInputText(e.target.value);
        }

        async function HandleSendMessage(e) {
          e.preventDefault();

          const newChatMessages = [
            ...messages,
            {
              message: inputText,
              sender: "user",
              id: Math.floor(Math.random() * 900) + 100,
            },
          ];

          setMessage(newChatMessages);

          const response = await Chatbot.getResponseAsync(inputText);

          setMessage(() => [
            ...newChatMessages,
            {
              message: response,
              sender: "robot",
              id: Math.floor(Math.random() * 900) + 100,
            },
          ]);

          fetchResponse();

          setInputText("");
        }

        return (
          <form action="submit">
            <input
              placeholder="Send message to chatbot"
              size="30"
              onChange={HandleInputChange}
              value={inputText}
            />
            <button type="submit" onClick={HandleSendMessage}>
              Send Message
            </button>
          </form>
        );
      }

      function DisplayMessage({ message, sender }) {
        return (
          <div>
            <img
              src={sender === "user" ? userPic : robotPic}
              alt="profile picture"
              width="50"
            />
            <p>{message}</p>
          </div>
        );
      }

      function ChatMessages({ messages }) {
        return (
          <>
            {messages.map((instance) => (
              <DisplayMessage
                key={instance.id}
                message={instance.message}
                sender={instance.sender}
              />
            ))}
          </>
        );
      }

      function App() {
        const [messages, setMessage] = React.useState([
          {
            message: "hello chatbot",
            sender: "user",
            id: 101,
          },
          {
            message: "Hello! How can I help you?",
            sender: "robot",
            id: 102,
          },
          {
            message: "can you get me todays date",
            sender: "user",
            id: 103,
          },
          {
            message: "Today is April 3",
            sender: "robot",
            id: 104,
          },
        ]);

        return (
          <>
            <ChatInput messages={messages} setMessage={setMessage} />

            <ChatMessages messages={messages} />
          </>
        );
      }

      root.render(<App />);
    </script>
  </body>
</html>
