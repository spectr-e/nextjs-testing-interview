<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      const userPic = "https://supersimple.dev/projects/chatbot/user.png";
      const robotPic = "https://supersimple.dev/projects/chatbot/robot.png";

      function ChatInput() {
        return (
          <>
            <input placeholder="Send message to chatbot" size="30" />
            <button>Send</button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        return (
          <div>
            <img
              src={sender === "user" ? userPic : robotPic}
              alt="profile picture"
              width="50"
            />
            <p>{message}</p>
          </div>
        );
      }

      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessage message="hello chatbot" sender="user" />
            <ChatMessage message="Hello! How can I help you?" />
            <ChatMessage message="can you get me todays date" sender="user" />
            <ChatMessage message="Today is April 3" />
          </>
        );
      }

      root.render(<App />);
    </script>
  </body>
</html>
